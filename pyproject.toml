# VIPER-AI as a pip-installable package (parallel to deploy\Deploy-TradingAgent.ps1, which stays unchanged).
#
#   install:  python -m pip install <repo-path>
#   update:   python -m pip install --upgrade <repo-path>
#   web:      python -m pip install "<repo-path>[web]"
#
# The existing source folders are mapped into the package, nothing is moved in the repository:
#   tools/trading -> viper_ai.app   (domain modules + CLI scripts; only the versioned *_v1.json universe files are packaged)
#   mcp-tools     -> viper_ai.mcp   (MCP server)
#   viper_ai      -> viper_ai       (CLI, viper_ai.shared: view models and services of the web, viper_ai.tasks: task definitions and OS backends)
#   web           -> viper_ai.web   (local web front end, needs the extra "web")
# Runtime data (database, logs, scheduler, *_local.json, app\data) stays under the trading root (C:\tools\Viper-AI or VIPER_TRADING_ROOT)
# and is never part of the package, so pip install / upgrade / uninstall cannot touch it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "VIPER-AI"
dynamic = ["version"]
description = "VIPER-AI: local MCP-based trading agent for portfolio analysis and simulation (no order execution)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Robert Backhaus" }]
# the pinned runtime versions of requirements.txt (keep them in sync)
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.13.5",
    "pypdf==6.21.2",
]

[project.optional-dependencies]
# the local web front end (viper-ai-web) and its reasoning workflow (LangGraph with the SQLite checkpointer); uvicorn and starlette come with mcp.
# The scheduled tasks are defined in viper_ai.tasks and deployed to the Windows Task Scheduler or systemd user timers; there is no scheduler of VIPER's own.
web = [
    "fastapi==0.162.0",
    "langgraph==1.2.17",
    "langgraph-checkpoint-sqlite==3.1.2",
]

[project.scripts]
viper-ai = "viper_ai.cli:main"
viper-ai-mcp = "viper_ai.cli:mcp_server"
viper-ai-orchestrator = "viper_ai.cli:orchestrator"
viper-ai-import-parqet = "viper_ai.cli:import_parqet"
viper-ai-import-transactions = "viper_ai.cli:import_transactions"
viper-ai-refresh-etf = "viper_ai.cli:refresh_etf"
viper-ai-backfill-market-data = "viper_ai.cli:backfill_market_data"
viper-ai-backfill-fx-rates = "viper_ai.cli:backfill_fx_rates"
viper-ai-backfill-events-news = "viper_ai.cli:backfill_events_news"
viper-ai-backfill-fundamentals-sec = "viper_ai.cli:backfill_fundamentals_sec"
viper-ai-discover-candidates = "viper_ai.cli:discover_candidates"
viper-ai-market-intelligence = "viper_ai.cli:market_intelligence"
viper-ai-web = "viper_ai.cli:web"

[project.gui-scripts]
viper-ai-start = "viper_ai.cli:start"
viper-ai-task = "viper_ai.cli:task"

[tool.setuptools]
include-package-data = false
packages = [
    "viper_ai",
    "viper_ai.app",
    "viper_ai.mcp",
    "viper_ai.shared",
    "viper_ai.shared.services",
    "viper_ai.shared.viewmodels",
    "viper_ai.tasks",
    "viper_ai.web",
]

[tool.setuptools.cmdclass]
# start every build from an empty build/lib, so a module removed from the repository never lands in the wheel (viper_ai/_build.py)
build_py = "viper_ai._build.CleanBuildPy"

[tool.setuptools.package-dir]
"viper_ai.app" = "tools/trading"
"viper_ai.mcp" = "mcp-tools"
"viper_ai.web" = "web"

[tool.setuptools.package-data]
# versioned universe files only; *_local.json and their backups are private runtime data
"viper_ai.app" = ["universe/*_v1.json"]
"viper_ai.web" = ["static/*", "static/js/*", "static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "viper_ai.__version__" }
